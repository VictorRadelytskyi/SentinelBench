[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-posttrain-lab"
version = "0.1.0"
description = "Post-training lab for security agents with PyTorch, TRL, PEFT, and reproducible evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
training = ["transformers>=4.46", "peft>=0.13", "trl>=0.12", "datasets>=3.0"]
distributed = ["deepspeed>=0.15", "accelerate>=1.0"]
serving = ["vllm>=0.6"]
dev = ["pytest>=8.0"]

[project.scripts]
posttrain-lab = "sentinelbench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]